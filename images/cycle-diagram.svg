<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="A cyclical process diagram showing four stages: Audit, Co-design, Prototype, and Implement, connected by arrows that loop continuously.">
  <defs>
    <radialGradient id="cyc-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DBBCF5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#DBBCF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyc-accent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4490D9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4490D9" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4490D9"/>
    </marker>
  </defs>
  <circle cx="240" cy="240" r="220" fill="url(#cyc-bg)"/>
  <circle cx="240" cy="240" r="140" fill="url(#cyc-accent)"/>
  <circle cx="240" cy="240" r="170" fill="none" stroke="#4490D9" stroke-width="1" stroke-dasharray="3 5" opacity="0.5"/>
  <path d="M 376 198 A 170 170 0 0 1 376 282" stroke="#4490D9" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 282 376 A 170 170 0 0 1 198 376" stroke="#4490D9" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 104 282 A 170 170 0 0 1 104 198" stroke="#4490D9" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M 198 104 A 170 170 0 0 1 282 104" stroke="#4490D9" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0.85"/>
  <g>
    <circle cx="240" cy="60" r="50" fill="#F2EDED" stroke="#4490D9" stroke-width="1.5"/>
    <text x="240" y="55" text-anchor="middle" font-family="Neue Montreal, system-ui, sans-serif" font-size="11" fill="#4490D9" font-weight="500" letter-spacing="0.08em">01</text>
    <text x="240" y="76" text-anchor="middle" font-family="Neue Montreal, system-ui, sans-serif" font-size="15" fill="#11132A" font-weight="500" letter-spacing="-0.01em">Audit</text>
  </g>
  <g>
    <circle cx="420" cy="240" r="50" fill="#F2EDED" stroke="#4490D9" stroke-width="1.5"/>
    <text x="420" y="235" text-anchor="middle" font-family="Neue Montreal, system-ui, sans-serif" font-size="11" fill="#4490D9" font-weight="500" letter-spacing="0.08em">02</text>
    <text x="420" y="256" text-anchor="middle" font-family="Neue Montreal, system-ui, sans-serif" font-size="15" fill="#11132A" font-weight="500" letter-spacing="-0.01em">Co-design</text>
  </g>
  <g>
    <circle cx="240" cy="420" r="50" fill="#F2EDED" stroke="#4490D9" stroke-width="1.5"/>
    <text x="240" y="415" text-anchor="middle" font-family="Neue Montreal, system-ui, sans-serif" font-size="11" fill="#4490D9" font-weight="500" letter-spacing="0.08em">03</text>
    <text x="240" y="436" text-anchor="middle" font-family="Neue Montreal, system-ui, sans-serif" font-size="15" fill="#11132A" font-weight="500" letter-spacing="-0.01em">Prototype</text>
  </g>
  <g>
    <circle cx="60" cy="240" r="50" fill="#F2EDED" stroke="#4490D9" stroke-width="1.5"/>
    <text x="60" y="235" text-anchor="middle" font-family="Neue Montreal, system-ui, sans-serif" font-size="11" fill="#4490D9" font-weight="500" letter-spacing="0.08em">04</text>
    <text x="60" y="256" text-anchor="middle" font-family="Neue Montreal, system-ui, sans-serif" font-size="15" fill="#11132A" font-weight="500" letter-spacing="-0.01em">Implement</text>
  </g>
</svg>
